[project]
name = "fartask"
version = "1.0.6"
description = "Task submission and tracking for SLURM/C++ compute jobs, with a NiceGUI web dashboard"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [ "funshell>=1.0.19", "farlog>=1.1.7", "sqlalchemy>=2.0.50", "nicegui>=1.4.0",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/fartask"
Releases = "https://github.com/farfarfun/fartask/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
license-files = []

[dependency-groups]
dev = [ "pytest>=7.0",]
